<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vivian's 3D Scene — Bronze Whale</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #ECECEC">
    <!-- Vivian's existing objects -->
    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow></a-box>
    <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" shadow></a-sphere>
    <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" shadow></a-cylinder>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" shadow></a-plane>
    <a-sky src="field-with-clouds.jpg"></a-sky>

    <!-- Bronze whale statue. Adjust scale/height after preview if necessary. -->
    
<a-entity
  gltf-model="url(bronze_whale_rusty_gold.glb)"
  position="0 0 -4"
  rotation="0 90 0"
  scale="1 1 1"
  visible="true">
</a-entity>

    <a-light type="directional" position="-2 6 3" color="#FFE5B4" intensity="1.2"></a-light>
  </a-scene>
</body>
</html>
